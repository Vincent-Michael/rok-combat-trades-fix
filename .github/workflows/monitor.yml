name: RoK Combat Trades
# On-demand run trigger #32 (2026-11-21): no change to workflow behavior.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitor_inf.py'
      - 'monitor_cav.py'
      - 'monitor_archer.py'
      - '.github/workflows/monitor.yml'
  schedule:
    # Candidate UTC hours for 01:50, 09:50 and 17:50 Europe/Berlin.
    # Both CET and CEST are covered; the gate below runs collection only at the matching local hour.
    - cron: '50 0,1,8,9,16,17 * * *'
permissions:
  contents: write
concurrency:
  group: rok-combat-trades
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Europe/Berlin collection window
        id: window
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
          else
            berlin_hour=$(TZ=Europe/Berlin date +%H)
            if [[ "$berlin_hour" == "01" || "$berlin_hour" == "09" || "$berlin_hour" == "17" ]]; then
              echo "collect=true" >> "$GITHUB_OUTPUT"
            else
              echo "collect=false" >> "$GITHUB_OUTPUT"
              echo "Skipping extra UTC candidate: Berlin local hour is $berlin_hour"
            fi
          fi
      - uses: actions/checkout@v5
        if: steps.window.outputs.collect == 'true'
      - uses: actions/setup-python@v6
        if: steps.window.outputs.collect == 'true'
        with:
          python-version: '3.12'
      - name: Fetch 11 infantry, 11 cavalry and 9 archer pairings
        if: steps.window.outputs.collect == 'true'
        run: |
          python monitor_inf.py
          python monitor_cav.py
          python monitor_archer.py
      - name: Commit report and data
        if: steps.window.outputs.collect == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REPORT_INF.md data/trades_inf.json REPORT_CAV.md data/trades_cav.json REPORT_ARCHER.md data/trades_archer.json charts/infantry.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update Combat Lab infantry, cavalry and archer trade reports'
            git push
          fi
