name: RoK Combat Trades
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitor_inf.py'
      - 'monitor_cav.py'
      - 'monitor_archer.py'
      - '.github/workflows/monitor.yml'
  schedule:
    # Main collection: 10 minutes before the 02:00, 10:00 and 18:00 Berlin reports.
    # GitHub Actions supports IANA time zones and handles CET/CEST automatically.
    - cron: '50 1,9,17 * * *'
      timezone: 'Europe/Berlin'
    # Backup: if the main run was missed or did not complete all three monitors.
    - cron: '55 1,9,17 * * *'
      timezone: 'Europe/Berlin'
permissions:
  contents: write
concurrency:
  group: rok-combat-trades
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run backup only if this Berlin reporting window has not been collected
        id: backup
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          run_backup = os.environ.get("GITHUB_EVENT_NAME") == "schedule" and os.environ.get("SCHEDULE_CRON") == "55 1,9,17 * * *"
          collect = True
          if run_backup:
              berlin = ZoneInfo("Europe/Berlin")
              now = datetime.now(berlin)
              def report_window(dt):
                  local = dt.astimezone(berlin)
                  for hour in (17, 9, 1):
                      if local.hour >= hour:
                          return (local.date().isoformat(), hour)
                  return ((local - timedelta(days=1)).date().isoformat(), 17)

              expected = report_window(now)
              checks = (("inf", 11), ("cav", 11), ("archer", 9))
              completed = []
              for troop, expected_count in checks:
                  try:
                      data = json.loads(Path(f"data/trades_{troop}.json").read_text(encoding="utf-8"))
                      checked = datetime.fromisoformat(data["lastCheckedAtUTC"].replace("Z", "+00:00"))
                      completed.append(
                          report_window(checked) == expected
                          and data.get("scenario") == "7d/openField"
                          and data.get("lastRunSuccessCount") == expected_count
                          and len(data.get("snapshots", {})) == expected_count
                      )
                  except (OSError, KeyError, ValueError, TypeError, json.JSONDecodeError):
                      completed.append(False)
              collect = not all(completed)
              print(f"Backup check: window={expected}; complete={completed}; collect={collect}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"collect={'true' if collect else 'false'}\n")
          PY
      - uses: actions/setup-python@v6
        if: steps.backup.outputs.collect == 'true'
        with:
          python-version: '3.12'
      - name: Fetch 11 infantry, 11 cavalry and 9 archer pairings
        if: steps.backup.outputs.collect == 'true'
        run: |
          python monitor_inf.py
          python monitor_cav.py
          python monitor_archer.py
      - name: Commit report and data
        if: steps.backup.outputs.collect == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REPORT_INF.md data/trades_inf.json REPORT_CAV.md data/trades_cav.json REPORT_ARCHER.md data/trades_archer.json charts/infantry.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update Combat Lab infantry, cavalry and archer trade reports'
            git push
          fi
