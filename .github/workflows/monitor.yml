name: RoK Combat Trades
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitor.py'
      - '.github/workflows/monitor.yml'
  schedule:
    # Every 8h. CET: 02:00 / 10:00 / 18:00 Berlin.
    # CEST: 03:00 / 11:00 / 19:00 Berlin.
    - cron: '0 1,9,17 * * *'
permissions:
  contents: write
concurrency:
  group: rok-combat-trades
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch 6 pairings and update report
        run: python monitor.py
      - name: Commit report and data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REPORT.md data/trades.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Combat Lab trade report'
            git push
          fi
