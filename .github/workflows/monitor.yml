name: RoK Combat Trades
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitor.py'
      - 'monitor_cav.py'
      - '.github/workflows/monitor.yml'
  schedule:
    # Collect data 30 minutes ahead of the 02/10/18 local ChatGPT reports.
    - cron: '30 1,9,17 * * *'
      timezone: 'Europe/Berlin'
permissions:
  contents: write
concurrency:
  group: rok-combat-trades
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch infantry and 11 cavalry pairings
        run: |
          python monitor.py
          python monitor_cav.py
      - name: Commit report and data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REPORT.md data/trades.json REPORT_CAV.md data/trades_cav.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Combat Lab infantry and cavalry trade reports'
            git push
          fi
