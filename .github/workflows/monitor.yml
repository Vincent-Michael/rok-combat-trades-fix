name: RoK Combat Trades
# On-demand run trigger (2026-11-21): no change to workflow behavior.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitor_inf.py'
      - 'monitor_cav.py'
      - 'monitor_archer.py'
      - '.github/workflows/monitor.yml'
  schedule:
    # Collect data 10 minutes ahead of the 02/10/18 local ChatGPT reports.
    - cron: '50 1,9,17 * * *'
      timezone: 'Europe/Berlin'
permissions:
  contents: write
concurrency:
  group: rok-combat-trades
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch 11 infantry, 11 cavalry and 9 archer pairings
        run: |
          python monitor_inf.py
          python monitor_cav.py
          python monitor_archer.py
      - name: Commit report and data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REPORT_INF.md data/trades_inf.json REPORT_CAV.md data/trades_cav.json REPORT_ARCHER.md data/trades_archer.json charts/infantry.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update Combat Lab infantry, cavalry and archer trade reports'
            git push
          fi
