name: RoK Combat Trades

# The only configured trigger is workflow_dispatch, called by cron-job.org
# at 01:50, 09:50 and 17:50 Europe/Berlin.
on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force re-collection for manual tests (bypass completed-window gate)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Serialize external dispatches; a second run checks the latest committed state
# after the first finishes.
concurrency:
  group: rok-combat-trades
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Test shared Combat Lab API handling
        run: python3 -m unittest discover -s tests -v

      - name: Skip completed reporting windows
        id: gate
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
        run: python3 scripts/should_collect.py

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.collect == 'true'
        with:
          python-version: '3.12'

      - name: Fetch 13 infantry, 14 cavalry and 10 archer pairings
        if: steps.gate.outputs.collect == 'true'
        run: |
          python monitor_inf.py
          python monitor_cav.py
          python monitor_archer.py

      - name: Commit report and data only when changed
        if: steps.gate.outputs.collect == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REPORT_INF.md data/trades_inf.json REPORT_CAV.md data/trades_cav.json REPORT_ARCHER.md data/trades_archer.json charts/infantry.svg charts/cavalry.svg charts/archer.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update Combat Lab infantry, cavalry and archer trade reports'
            git push
          fi
