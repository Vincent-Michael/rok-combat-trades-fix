name: RoK Combat Trades

on:
  # cron-job.org dispatches at 01:50, 09:50 and 17:50 Europe/Berlin.
  workflow_dispatch:
    inputs:
      force:
        description: "Recheck data even if this reporting window already completed"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'monitor_inf.py'
      - 'monitor_cav.py'
      - 'monitor_archer.py'
      - 'scripts/should_collect.py'
      - '.github/workflows/monitor.yml'
  schedule:
    # GitHub backup only: five minutes after the external trigger.
    - cron: '55 1,9,17 * * *'
      timezone: 'Europe/Berlin'

permissions:
  contents: write

concurrency:
  group: rok-combat-trades
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Applies to scheduled, external dispatch and push-triggered runs.
      - name: Skip already verified report windows
        id: gate
        env:
          FORCE_COLLECTION: ${{ inputs.force }}
        run: python3 scripts/should_collect.py

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.collect == 'true'
        with:
          python-version: '3.12'

      - name: Fetch 11 infantry, 11 cavalry and 9 archer pairings
        if: steps.gate.outputs.collect == 'true'
        run: |
          python monitor_inf.py
          python monitor_cav.py
          python monitor_archer.py

      - name: Commit report and data only when changed
        if: steps.gate.outputs.collect == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REPORT_INF.md data/trades_inf.json REPORT_CAV.md data/trades_cav.json REPORT_ARCHER.md data/trades_archer.json charts/infantry.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update Combat Lab infantry, cavalry and archer trade reports'
            git push
          fi
